[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "iroc"
version = "0.1.0"
description = "A Jupyter kernel for the Roc programming language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ipykernel>=6.29,<7", "jupyter-client>=8,<9", "simplejson>=3.19,<4"]

[project.scripts]
iroc = "iroc.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["iroc"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
